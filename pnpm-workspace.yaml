packages:
  - 'apps/*'
  - 'packages/*'

# cpu-features / ssh2 / protobufjs are `testcontainers`' transitive deps
# (derived-data/03) for its optional remote-Docker-over-SSH tunnel path —
# not needed for the local-Docker-socket use every test in this repo
# actually uses. Declined (false): skips their native builds rather than
# compiling crypto acceleration nobody exercises here.
allowBuilds:
  # `providers-and-gates/05`, transitive via `@sentry/react-native`. Its
  # postinstall fetches the platform `sentry-cli` binary, and that binary is
  # the entire source-map story: both the Expo config plugin's generated
  # native upload build phase and `pnpm --filter mobile sentry:sourcemaps`
  # shell out to it. Declining it leaves crash reports as minified stack
  # traces, which `release-ops` §3 rates as equivalent to no crash reporting
  # at all. Allowed (true). Two versions resolve (the SDK's own, plus
  # `@sentry/expo-upload-sourcemaps`'); one key covers both.
  '@sentry/cli': true
  # `ui-primitives-data/02`. Its postinstall (`scripts/install-libs.js`) only
  # COPIES the prebuilt Skia binaries out of the `react-native-skia-android` /
  # `-apple-*` sibling packages into the package's own `libs/` — it compiles
  # nothing and downloads nothing. Declining it leaves `libs/` empty and the
  # native build fails at link time with a missing framework, which reads like
  # a project misconfiguration and is not one. Allowed (true).
  '@shopify/react-native-skia': true
  cpu-features: false
  esbuild: true
  # bullmq's msgpack encoder (`background-jobs/01-bullmq-setup.md`) — unlike
  # cpu-features/ssh2/protobufjs above, this is a runtime dependency of a
  # queue actually in use, not a dead code path. Allowed so job payloads use
  # the native (de)serializer rather than silently falling back to the
  # slower pure-JS one.
  msgpackr-extract: true
  protobufjs: false
  ssh2: false
  unrs-resolver: true

# GHSA-w3rx-r6r6-pgpr / GHSA-5p2g-fcmc-qvqq — image-size (transitive, via
# metro <- react-native <- expo, apps/mobile's build toolchain only; never
# runtime-shipped code). Both are DoS-via-malformed-image-parsing; GitHub's
# own advisory lists first_patched_version: null for each — no version of
# image-size fixes them yet as of 2026-08-21. `pnpm audit --ignore <id>`
# wrote this block; it's what keeps CI's audit gate (quality-gates/03) from
# going permanently red on an advisory nobody can currently act on. Remove
# an entry the day image-size actually ships a fix — check `pnpm audit`
# locally before removing either one.
auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq

minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.102.0'
  - '@tanstack/react-query@5.102.0'
  - bullmq@6.3.1

# Metro (React Native's bundler) does not reliably follow pnpm's default
# symlinked node_modules layout. A flat, hoisted tree avoids resolution
# failures that otherwise look like missing modules. See CLAUDE.md §3.1.
nodeLinker: hoisted

# jest-config's own dependency on jest-environment-node stays pinned to the
# 29.x line even under jest@30 (same for jest-environment-jsdom, pulled in
# by jest-expo). Left alone, that nests an old jest-mock that jest-runtime
# 30.4.2 can't talk to — "clearMocksOnScope is not a function" the moment
# clearMocks/restoreMocks run (packages/config/jest.base.js). Force the
# whole workspace onto one matching jest-mock/-environment-* line instead
# of turning those settings off (quality-gates/01).
overrides:
  jest-environment-node: '30.4.1'
  jest-environment-jsdom: '30.4.1'
  jest-mock: '30.4.1'
  # GHSA-jqff-g426-hqxp and three related host-confusion/SSRF advisories —
  # transitive via @commitlint/cli -> ajv, a devDependency never shipped.
  # commitlint@21.2.2 is already latest and hasn't picked up a patched ajv;
  # this forces the fix directly. Remove once commitlint's own tree clears 3.1.6.
  fast-uri: '>=3.1.6'
